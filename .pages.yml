# ============================================================================
# Pages CMS Configuration
# Documentation: https://pagescms.org/docs/configuration/
# ============================================================================

# ============================================================================
# MEDIA
# ============================================================================
media:
  # Default: absolute /src/assets paths, resolved by the site's own image
  # pipeline (image fields, and rich-text inside page sections/YAML/JSON).
  - name: images
    label: All Images
    input: src/assets
    output: /src/assets
  # Markdown bodies of articles and docs are rendered by Astro, which resolves
  # image paths relative to the .md file (src/content/<collection>/).
  - name: body-images
    label: Body Images
    input: src/assets
    output: ../../assets

# ============================================================================
# REUSABLE COMPONENTS
# ============================================================================
components:
  # --------------------------------------------------------------------------
  # Primitives (button, card, background)
  # --------------------------------------------------------------------------

  button:
    type: object
    fields:
      - name: text
        label: Text
        type: string
        required: true
        description: The text displayed on the button
      - name: link
        label: Link
        component: flexible_link
        description: Pick a page on this site, or enter an external URL. A button with no Link and no Custom URL is not shown.
      - name: href
        label: Custom URL
        type: string
        description: 'Only used when Link is empty — for anchors (#section), mailto: links and the like'
      - name: variant
        label: Variant
        type: select
        options:
          values:
            - label: Primary
              value: primary
            - label: Secondary
              value: secondary
            - label: Outline
              value: outline
            - label: Ghost
              value: ghost
        required: true
        default: primary
        description: Primary for the main action, outline or ghost for secondary actions
      - name: size
        label: Size
        type: select
        options:
          values:
            - label: Small
              value: sm
            - label: Medium
              value: md
            - label: Large
              value: lg
            - label: Extra large
              value: xl
        required: true
        default: md
      - name: icon
        label: Icon
        type: select
        options:
          values:
            - label: Arrow (after text)
              value: arrow-right
            - label: External link (after text)
              value: external
            - label: Download
              value: download
            - label: Email
              value: email
            - label: Calendar
              value: calendar
            - label: Document
              value: document
            - label: Chat
              value: chat
            - label: Heart
              value: heart
            - label: Play
              value: play
        description: Optional. Leave empty for a text-only button.

  card:
    type: object
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: content
        label: Content
        type: rich-text
        description: Brief description of the card
      - name: image
        label: Image
        type: image
        description: Card image (absolute path, e.g. /src/assets/images/card.jpg)
      - name: color
        label: Color
        type: select
        options:
          values:
            - label: Primary
              value: primary
            - label: Secondary
              value: secondary
            - label: Highlight
              value: highlight
            - label: Neutral
              value: neutral
        description: Card color theme
      - name: button
        label: Button
        component: button

  social_link:
    type: object
    fields:
      - name: platform
        label: Platform
        type: select
        required: true
        options:
          values:
            - label: Website
              value: website
            - label: Email
              value: email
            - label: Newsletter
              value: newsletter
            - label: RSS feed
              value: rss
            - label: Bluesky
              value: bluesky
            - label: Mastodon
              value: mastodon
            - label: Threads
              value: threads
            - label: X
              value: x
            - label: LinkedIn
              value: linkedin
            - label: Instagram
              value: instagram
            - label: Facebook
              value: facebook
            - label: YouTube
              value: youtube
            - label: PeerTube
              value: peertube
            - label: GitHub
              value: github
            - label: GitLab
              value: gitlab
            - label: Codeberg
              value: codeberg
            - label: Medium
              value: medium
            - label: Substack
              value: substack
            - label: Signal
              value: signal
            - label: Matrix
              value: matrix
            - label: Discord
              value: discord
            - label: ORCID
              value: orcid
      - name: url
        label: URL
        type: string
        required: true
        description: 'Full URL (https://…). For Email, the address on its own is fine.'

  # --------------------------------------------------------------------------
  # Navigation
  # --------------------------------------------------------------------------

  flexible_link:
    type: block
    blockKey: type
    description: Link that can reference an internal page or external URL
    blocks:
      - name: internal
        label: Internal Page Link
        fields:
          - name: pageRef
            label: Page Reference
            type: reference
            required: true
            options:
              collection: pages
              value: '/{permalink}'
              label: '{title} (/{permalink})'
            description: Select a page from the pages collection

      - name: external
        label: External Link
        fields:
          - name: url
            label: External URL
            type: string
            required: true
            description: Full URL (e.g. https://example.com)
            pattern:
              message: 'Must be a valid URL starting with http:// or https://'
              regex: '^https?://.+'

  nav_link_item:
    type: object
    fields:
      - name: label
        label: Link Label
        type: string
        required: true
        description: Text displayed for the link
      - name: link
        label: Link
        component: flexible_link
        required: true
      - name: description
        label: Description
        type: string
        description: Optional description for accessibility

  navigation_menu_item_child:
    type: block
    blockKey: type
    description: Second-level item — a single link, or a group of links (third level)
    blocks:
      - name: link
        label: Single Link
        component: nav_link_item
      - name: dropdown
        label: Link Group
        fields:
          - name: label
            label: Group Label
            type: string
            required: true
            description: Heading shown above the grouped links
          - name: children
            label: Group Links
            component: nav_link_item
            list: true
            required: true
            description: Links shown under this group heading

  navigation_menu_item:
    type: block
    blockKey: type
    description: Navigation item that can be a single link or a dropdown menu with multiple links
    blocks:
      - name: link
        label: Single Link
        component: nav_link_item
      - name: dropdown
        label: Dropdown Menu
        fields:
          - name: label
            label: Menu Label
            type: string
            required: true
            description: Text displayed for the dropdown menu
          - name: children
            label: Menu Items
            component: navigation_menu_item_child
            list: true
            required: true
            description: Links or link groups in the dropdown menu

  section_heading:
    type: object
    fields:
      - name: text
        label: Title
        type: string
      - name: style
        label: Style
        type: select
        default: plain
        options:
          values:
            - label: Plain
              value: plain
            - label: Highlighted
              value: highlight
        description: Highlighted draws a marker stroke behind the title

  testimonial:
    type: object
    fields:
      - name: quote
        label: Quote
        type: rich-text
        required: true
      - name: person
        label: Person
        type: reference
        options:
          collection: people
          value: '{id}'
          label: '{fields.name}'
        description: Optional. Fills in the name, role and photo from the People collection when those are left empty.
      - name: name
        label: Name
        type: string
        description: Who said it. Required unless a person is picked.
      - name: role
        label: Role / Affiliation
        type: string
        description: e.g. "Organiser, Community Mesh Network"
      - name: image
        label: Photo
        type: image
        description: Optional small portrait

  # --------------------------------------------------------------------------
  # Layout
  # --------------------------------------------------------------------------

  background_select:
    type: object
    fields:
      # Keep in sync with sectionBackgrounds in src/utils/backgrounds.ts
      - name: bgColor
        label: Color
        type: select
        options:
          values:
            - label: White
              value: white
            - label: Gray
              value: gray
            - label: Gradient
              value: gradient
            - label: Primary (light)
              value: primary-light
            - label: Secondary (light)
              value: secondary-light
            - label: Highlight (light)
              value: highlight-light
            - label: Dark
              value: dark
            - label: Highlight (dark)
              value: highlight-dark
        default: white
        description: Section background. Dark backgrounds switch the text to light colours automatically.
      - name: bgType
        label: Type
        type: select
        options:
          values:
            - label: Full-width
              value: full
            - label: Contained
              value: contained
            - label: Highlight shape
              value: highlight
        default: full
        description: Full-width fills the whole row, Contained only fills behind the content, Highlight shape adds the decorative highlight instead of a colour

  # --------------------------------------------------------------------------
  # Section components
  # --------------------------------------------------------------------------

  hero_section:
    type: object
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: subtitle
        label: Subtitle
        type: string
      - name: backgroundImage
        label: Background Image
        type: image
        description: Optional hero background image
      - name: image
        label: Side Image
        type: image
        description: Optional illustration or photo shown beside the text
      - name: imageAlt
        label: Side Image Alt Text
        type: string
        description: Describe the image for screen readers. Leave empty if it is purely decorative.
      - name: imagePosition
        label: Side Image Position
        type: select
        default: right
        options:
          values:
            - label: Right
              value: right
            - label: Left
              value: left
      - name: align
        label: Text Alignment
        type: select
        default: center
        options:
          values:
            - label: Centered
              value: center
            - label: Left
              value: left
        description: With a side image the text is always left-aligned

  richtext_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: withTOC
        label: Include Table of Contents
        type: boolean
        default: false
      - name: content
        label: Content
        type: rich-text
        required: true
        description: Markdown content for this section

  button_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: title
        label: Title (Optional)
        type: string
        required: false
      - name: buttons
        label: Buttons
        component: button
        list: true

  card_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: rich-text
      - name: cards
        label: Cards
        component: card
        list: true
        description: Grid of content cards
      - name: buttons
        label: Action Buttons
        component: button
        list: true
        description: Buttons at the bottom of the section

  people_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: category
        label: Category
        type: select
        description: Only show people in this section/department. Leave empty to show all people.
        options:
          # pages-cms:category-sync start people
          values:
            - Leadership
            - Engineering
            - Product
            - Design
            - Marketing
            - Sales
            - Operations
            - Community
          # pages-cms:category-sync end

  partners_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: title
        label: Title
        type: string
        required: true
      - name: category
        label: Category
        type: select
        description: Only show partners in this category. Leave empty to show all partners.
        options:
          # pages-cms:category-sync start partners
          values:
            - sponsor
            - infrastructure
            - community
            - technology
            - media
          # pages-cms:category-sync end

  articles_roll_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: title
        label: Title
        type: string
        default: Latest Articles
      - name: limit
        label: Number of Articles
        type: number
        default: 3
        description: How many articles to show (1-12)
      - name: category
        label: Category Filter
        type: select
        description: Only show articles from this category. Leave empty to show all.
        options:
          # pages-cms:category-sync start articles
          values:
            - Privacy
            - Security
            - Accessibility
            - Civic Tech
            - Design
            - Technology
            - Tutorial
            - News
            - Opinion
          # pages-cms:category-sync end
      - name: showViewAll
        label: Show "View All" Button
        type: boolean
        default: true
        description: Display a link to the full articles page

  featured_partners_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: title
        label: Title
        type: string
      - name: description
        label: Description
        type: rich-text
      - name: partners
        label: Specific Partners
        type: string
        list: true
        description: Partner IDs to feature. Leave empty to auto-select.
      - name: limit
        label: Limit
        type: number
        default: 4
        description: Max number of partners to show
      - name: showViewAll
        label: Show "View All" Button
        type: boolean
        default: false

  resources_roll_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: title
        label: Title
        type: string
        default: Resources
      - name: description
        label: Description
        type: rich-text
      - name: limit
        label: Number of Resources
        type: number
        default: 3
        description: How many resources to show (1-12)
      - name: showViewAll
        label: Show "View All" Button
        type: boolean
        default: false
        description: Display a link to the full resources page

  call_to_action_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: title
        label: Title
        component: section_heading
      - name: description
        label: Description
        type: rich-text
      - name: buttons
        label: Buttons
        component: button
        list: true
      - name: image
        label: Image
        type: image
        description: Optional. With an image the section becomes two columns.
      - name: imageAlt
        label: Image Alt Text
        type: string
        description: Describe the image for screen readers. Leave empty if it is purely decorative.
      - name: imagePosition
        label: Image Position
        type: select
        default: right
        options:
          values:
            - label: Right
              value: right
            - label: Left
              value: left

  mini_cta_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: text
        label: Text
        type: string
        required: true
        description: One short line. Markdown links and emphasis work.
      - name: button
        label: Button
        component: button

  testimonials_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: title
        label: Title
        component: section_heading
      - name: description
        label: Description
        type: rich-text
      - name: testimonials
        label: Testimonials
        component: testimonial
        list: true
        description: One quote shows as a large pull quote, several as a grid

  logo_wall_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: title
        label: Title
        component: section_heading
      - name: description
        label: Description
        type: rich-text
      - name: partners
        label: Partners
        type: reference
        options:
          collection: partners
          multiple: true
          value: '{id}'
          label: '{fields.name}'
        description: Logos in the order shown. Leave empty to show featured partners.
      - name: layout
        label: Layout
        type: select
        default: grid
        options:
          values:
            - label: Grid
              value: grid
            - label: Scrolling row
              value: scroll
        description: The scrolling row pauses on hover and has a pause button; it stays still for visitors who prefer reduced motion
      - name: fullBleed
        label: Full width
        type: boolean
        default: false
        description: Let the logos run edge to edge instead of inside the page width

  featured_articles_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: title
        label: Title
        component: section_heading
      - name: description
        label: Description
        type: rich-text
      - name: articles
        label: Articles
        type: reference
        options:
          collection: articles
          multiple: true
          value: '{permalink}'
          label: '{title}'
          image: '{fields.heroImage}'
        description: Hand-pick up to 6 articles, shown in this order (any beyond 6 are ignored). For the latest articles automatically, use the Articles Roll section instead.

# ============================================================================
# CONTENT COLLECTIONS
# ============================================================================
content:
  # --------------------------------------------------------------------------
  # Pages
  # --------------------------------------------------------------------------
  - name: pages
    label: Pages
    type: collection
    path: src/content/pages
    format: yaml
    filename: '{fields.permalink}.yaml'
    view:
      fields: [title, description, status]
      primary: title
    fields:
      - name: title
        label: Page Title
        type: string
        required: true
        description: The title of the page

      - name: permalink
        label: Permalink
        type: string
        description: The slug, without slashes or parents, like 'about-us' or 'omg-3'.
        pattern:
          {
            message: "This must be a web-safe string like 'about-us' or 'omg-3'.",
            regex: '^[a-zA-Z0-9_-]*$',
          }
        required: true

      - name: status
        label: Status
        type: select
        required: true
        default: draft
        options:
          values:
            - label: Draft
              value: draft
            - label: Published
              value: published
            - label: Archived
              value: archived
        description: Draft content is only visible in development/preview. New content defaults to Draft.

      - name: description
        label: Page Description
        type: rich-text
        description: SEO meta description

      - name: breadcrumbs
        label: Breadcrumbs
        type: select
        default: auto
        options:
          values:
            - label: Automatic (show when the page sits two or more levels deep in the menu)
              value: auto
            - label: Always show
              value: show
            - label: Hide
              value: hide
        description: Breadcrumb trail shown above the page content. Can be turned off site-wide in Site Configuration.

      - name: heroImage
        label: Hero Image
        type: image
        description: Background image for the page hero section

      - name: background
        label: Page Background
        type: select
        default: white
        options:
          values:
            - label: White
              value: white
            - label: Gray
              value: gray
            - label: Gradient
              value: gradient
            - label: Highlight
              value: highlight
        description: Default background style for the page

      - name: sections
        label: Page Sections
        type: block
        list: true
        required: true
        blockKey: type
        description: Add and arrange page sections in any order
        blocks:
          - name: hero
            label: Hero Section
            component: hero_section

          - name: richText
            label: Rich Text Section
            component: richtext_section

          - name: button
            label: Button Section
            component: button_section

          - name: card
            label: Card Section
            component: card_section

          - name: people
            label: People Section
            component: people_section

          - name: partners
            label: Partners Section
            component: partners_section

          - name: articlesRoll
            label: Articles Roll Section
            component: articles_roll_section

          - name: featuredPartners
            label: Featured Partners Section
            component: featured_partners_section

          - name: resourcesRoll
            label: Resources Roll Section
            component: resources_roll_section

          - name: featuredArticles
            label: Featured Articles Section
            component: featured_articles_section

          - name: callToAction
            label: Call to Action Section
            component: call_to_action_section

          - name: miniCta
            label: Mini Call to Action
            component: mini_cta_section

          - name: testimonials
            label: Testimonials Section
            component: testimonials_section

          - name: logoWall
            label: Logo Wall Section
            component: logo_wall_section

  # --------------------------------------------------------------------------
  # Articles
  # --------------------------------------------------------------------------
  - name: articles
    label: Articles
    type: collection
    path: src/content/articles
    filename: '{fields.permalink}.md'
    view:
      fields: [heroImage, title, publishedDate, status]
      primary: title
      sort: [publishedDate, title]
      default:
        sort: publishedDate
        order: desc
    fields:
      - name: permalink
        label: Permalink
        type: string
        required: true
        description: URL-friendly identifier (e.g. my-article-title)
        pattern:
          {
            message: "Must be a web-safe string like 'my-article-title'.",
            regex: '^[a-zA-Z0-9_-]*$',
          }

      - name: title
        label: Title
        type: string
        required: true
        description: Article title

      - name: excerpt
        label: Excerpt
        type: string
        description: Short summary of the article

      - name: authors
        label: Authors
        type: reference
        options:
          collection: people
          multiple: true
          value: "{id}"
          label: "{fields.name}"

      - name: status
        label: Status
        type: select
        required: true
        default: draft
        options:
          values:
            - label: Draft
              value: draft
            - label: Published
              value: published
            - label: Archived
              value: archived
        description: Draft content is only visible in development/preview. New content defaults to Draft.

      - name: publishedDate
        label: Published Date
        type: date
        options:
          format: yyyy-MM-dd
        required: true
        description: Date the article was published

      - name: heroImage
        label: Hero Image
        type: image
        description: Featured image for the article

      - name: relatedArticles
        label: Related Articles
        type: reference
        description: Select up to 3 related articles (any beyond 3 are ignored; empty slots are filled with articles sharing a category)
        options:
          collection: articles
          multiple: true
          value: "{permalink}"
          label: "{title}"
          image: "{fields.heroImage}"

      - name: relatedResources
        label: Related Resources
        type: reference
        description: Resources shown alongside this article
        options:
          collection: resources
          multiple: true
          value: '{id}'
          label: '{fields.title}'

      - name: categories
        label: Categories
        type: select
        options:
          multiple: true
          # pages-cms:category-sync start articles
          values:
            - Privacy
            - Security
            - Accessibility
            - Civic Tech
            - Design
            - Technology
            - Tutorial
            - News
            - Opinion
          # pages-cms:category-sync end

      - name: body
        label: Body
        type: rich-text
        options:
          media: body-images

  # --------------------------------------------------------------------------
  # Docs
  # --------------------------------------------------------------------------
  - name: docs
    label: Docs
    type: collection
    path: src/content/docs
    filename: '{fields.permalink}.md'
    view:
      fields: [title, chapter, order, status]
      primary: title
      sort: [chapterOrder, order]
      default:
        sort: chapterOrder
        order: asc
    fields:
      - name: permalink
        label: Permalink
        type: string
        required: true
        description: URL-friendly identifier (e.g. getting-started)
        pattern:
          message: "Must be a web-safe string like 'my-doc-page'."
          regex: '^[a-zA-Z0-9_-]*$'

      - name: title
        label: Title
        type: string
        required: true

      - name: chapter
        label: Chapter
        type: string
        required: true
        description: Chapter name this page belongs to (e.g. "Getting Started")

      - name: chapterOrder
        label: Chapter Order
        type: number
        required: true
        description: Order of this chapter in the sidebar (1, 2, 3...)

      - name: order
        label: Page Order
        type: number
        required: true
        description: Order within the chapter (1, 2, 3...)

      - name: status
        label: Status
        type: select
        required: true
        default: draft
        options:
          values:
            - label: Draft
              value: draft
            - label: Published
              value: published
            - label: Archived
              value: archived

      - name: description
        label: Description
        type: string
        description: Brief description of this page

      - name: body
        label: Body
        type: rich-text
        options:
          media: body-images

  # --------------------------------------------------------------------------
  # People
  # --------------------------------------------------------------------------
  - name: people
    label: People
    type: collection
    path: src/content/people
    format: json
    filename: '{fields.id}.json'
    subfolders: false
    view:
      fields: [headshot, name, title, status]
      primary: name
    fields:
      - name: id
        label: ID
        type: string
        required: true
        description: Unique identifier (slug format, e.g. john-doe)

      - name: name
        label: Name
        type: string
        required: true

      - name: status
        label: Status
        type: select
        required: true
        default: draft
        options:
          values:
            - label: Draft
              value: draft
            - label: Published
              value: published
            - label: Archived
              value: archived
        description: Draft content is only visible in development/preview. New content defaults to Draft.

      - name: headshot
        label: Headshot
        type: image
        required: true
        description: Absolute path from root (e.g. /src/assets/people/john-doe.png)

      - name: title
        label: Job Title / Role
        type: string

      - name: affiliation
        label: Affiliation
        type: string

      - name: extraInfo
        label: Other/Previous Affiliations
        type: string

      - name: url
        label: Link
        type: string
        description: Optional external link

      - name: socialLinks
        label: Social Links
        component: social_link
        list: true
        description: Profiles shown on this person's page

      - name: sections
        label: Sections/Departments
        type: select
        required: true
        options:
          multiple: true
          # pages-cms:category-sync start people
          values:
            - Leadership
            - Engineering
            - Product
            - Design
            - Marketing
            - Sales
            - Operations
            - Community
          # pages-cms:category-sync end

  # --------------------------------------------------------------------------
  # Partners
  # --------------------------------------------------------------------------
  - name: partners
    label: Partners
    type: collection
    path: src/content/partners
    format: json
    filename: '{fields.id}.json'
    subfolders: false
    view:
      fields: [image, name, affiliation, category, status]
      sort: [category, name]
      search: [name, affiliation]
      primary: name
    fields:
      - name: id
        label: ID
        type: string
        required: true
        description: Unique identifier (slug format, e.g. tech-corp)

      - name: name
        label: Partner Name
        type: string
        required: true

      - name: status
        label: Status
        type: select
        required: true
        default: draft
        options:
          values:
            - label: Draft
              value: draft
            - label: Published
              value: published
            - label: Archived
              value: archived
        description: Draft content is only visible in development/preview. New content defaults to Draft.

      - name: affiliation
        label: Affiliation
        type: string
        description: e.g. "Platinum Sponsor", "Technology Partner"

      - name: url
        label: Website URL
        type: string
        description: Partner's website URL

      - name: category
        label: Category
        type: select
        required: true
        description: One or more categories this partner belongs to
        options:
          multiple: true
          # pages-cms:category-sync start partners
          values:
            - sponsor
            - infrastructure
            - community
            - technology
            - media
          # pages-cms:category-sync end

      - name: image
        label: Logo
        type: image
        description: Absolute path to partner logo (e.g. /src/assets/partners/logo.png)

      - name: order
        label: Display Order
        type: number
        default: 999
        description: Lower numbers appear first (1, 2, 3...)

      - name: featured
        label: Featured
        type: boolean
        default: false
        description: Show this partner in featured sections

  # --------------------------------------------------------------------------
  # Resources
  # --------------------------------------------------------------------------
  - name: resources
    label: Resources
    type: collection
    path: src/content/resources
    format: json
    filename: '{fields.id}.json'
    subfolders: false
    view:
      fields: [title, category, year, status]
      sort: [year, title]
      search: [title, authors, description]
      primary: title
    fields:
      - name: id
        label: ID
        type: string
        required: true
        description: Unique identifier (e.g. 2024-api-design-guide)

      - name: title
        label: Title
        type: string
        required: true

      - name: status
        label: Status
        type: select
        required: true
        default: draft
        options:
          values:
            - label: Draft
              value: draft
            - label: Published
              value: published
            - label: Archived
              value: archived
        description: Draft content is only visible in development/preview. New content defaults to Draft.

      - name: description
        label: Description
        type: rich-text
        description: Brief summary of the resource (supports markdown)

      - name: authors
        label: Authors
        type: string
        description: Citation string (e.g. "Jane Doe, John Smith")

      - name: contributors
        label: Contributors
        type: reference
        options:
          collection: people
          required: false
          multiple: true
          value: '{id}'
          label: '{fields.name}'
        description: Link to people in the team

      - name: year
        label: Year
        type: number
        required: true
        description: Publication year

      - name: category
        label: Category
        type: select
        required: true
        options:
          multiple: false
          # pages-cms:category-sync start resources
          values:
            - report
            - whitepaper
            - case-study
            - guide
          # pages-cms:category-sync end

      - name: externalLinks
        label: External Links
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: url
            label: URL
            type: string
            required: true
            description: Full URL (e.g. https://example.com/paper.pdf)

      - name: relatedResources
        label: Related Resources
        type: reference
        description: Other resources shown on this resource's page
        options:
          collection: resources
          multiple: true
          value: '{id}'
          label: '{fields.title}'

      - name: publishedDate
        label: Published Date
        type: date
        options:
          format: yyyy-MM-dd
        description: Exact publication date (optional, year is used for sorting)

      - name: tags
        label: Tags
        type: string
        list: true

  # --------------------------------------------------------------------------
  # Categories
  # --------------------------------------------------------------------------
  - name: categories
    label: Categories
    type: collection
    path: src/content/categories
    format: json
    filename: '{fields.id}.json'
    subfolders: false
    view:
      fields: [name, id]
      primary: name
    fields:
      - name: id
        label: ID
        type: string
        required: true
        description: Unique identifier (e.g. people, partners, articles, resources)

      - name: name
        label: Name
        type: string
        required: true
        description: Display name for this category group

      - name: categories
        label: Categories
        type: string
        list: true
        required: true

  # --------------------------------------------------------------------------
  # Site Settings (singleton)
  # --------------------------------------------------------------------------
  - name: site-config
    label: Site Settings
    type: file
    path: src/content/site/config.json
    fields:
      - name: title
        label: Site Title
        type: string
        required: true
        description: The name of your website

      - name: description
        label: Site Description
        type: string
        required: true
        description: Default meta description for SEO

      - name: url
        label: Site URL
        type: string
        required: true
        description: Your website's URL (e.g. https://example.com)

      - name: favicon
        label: Favicon Path
        type: string
        default: /favicon.svg
        description: Path to your favicon file

      - name: defaultOgImage
        label: Default Open Graph Image
        type: image
        description: Default image for social media sharing

      - name: defaultLogoLight
        label: Logo (Light Background)
        type: image
        description: Site logo for use on light backgrounds

      - name: defaultLogoDark
        label: Logo (Dark Background)
        type: image
        description: Site logo for use on dark backgrounds

      - name: defaultLogoSquare
        label: Logo (Square)
        type: image
        description: Square logo used for OG image badges and favicons

      - name: social
        label: Social Media Links
        component: social_link
        list: true
        description: Shown in the footer, in this order

      - name: footer
        label: Footer
        type: object
        fields:
          - name: description
            label: Footer Description
            type: string
          - name: bottom
            label: Bottom Text
            type: string
            required: true
            description: Text shown at the bottom of the footer (supports markdown links)

      - name: archivedBanner
        label: Archived Banner
        type: object
        description: Banner shown on archived content pages. Leave empty to disable.
        fields:
          - name: message
            label: Message
            type: string
            required: true
            description: Text displayed in the archived page banner
          - name: color
            label: Color
            type: select
            required: true
            default: secondary
            options:
              values:
                - label: Primary
                  value: primary
                - label: Secondary
                  value: secondary
                - label: Highlight
                  value: highlight
                - label: Neutral
                  value: neutral
            description: Color palette for the banner

      - name: cookieConsent
        label: Cookie Consent
        type: object
        description: Cookie banner and analytics settings. Leave empty to disable.
        fields:
          - name: message
            label: Banner Message
            type: rich-text
            required: true
            description: Message shown in the cookie consent banner (supports markdown)
          - name: googleAnalyticsId
            label: Google Analytics Measurement ID
            type: string
            description: "GA4 Measurement ID (e.g. G-XXXXXXXXXX). Leave empty to disable analytics."

      - name: showBreadcrumbs
        label: Show Breadcrumbs
        type: boolean
        default: true
        description: Show a breadcrumb trail on nested pages and detail pages (articles, people, etc.). Individual pages can override this.

      - name: share
        label: Share Links
        type: object
        description: Share links shown on article and resource pages. They're plain links to each network's share page, so no third-party scripts are loaded.
        fields:
          - name: enabled
            label: Show Share Links
            type: boolean
            default: true
          - name: platforms
            label: Platforms
            type: select
            description: Leave empty for the default set (Bluesky, Mastodon, LinkedIn, Email). Copy link is always included when the browser supports it.
            options:
              multiple: true
              values:
                - label: Bluesky
                  value: bluesky
                - label: Mastodon
                  value: mastodon
                - label: LinkedIn
                  value: linkedin
                - label: Reddit
                  value: reddit
                - label: Email
                  value: email

      - name: analytics
        label: Analytics
        type: object
        description: Cookieless, privacy-preserving analytics. Only loaded on production builds (not in dev or preview). Leave empty to disable.
        fields:
          - name: umami
            label: Umami
            type: object
            fields:
              - name: src
                label: Script URL
                type: string
                description: "URL of your Umami tracker script (e.g. https://umami.example.org/script.js)"
              - name: websiteId
                label: Website ID
                type: string
                description: The website ID from your Umami dashboard

  # --------------------------------------------------------------------------
  # Redirects (applied at build time via astro.config.mjs)
  # --------------------------------------------------------------------------
  - name: redirects
    label: Redirects
    type: file
    path: src/content/site/_redirects.json
    fields:
      - name: redirects
        label: Redirects
        type: object
        list: true
        description: Send visitors from old URLs to new ones. Changes apply on the next deploy.
        fields:
          - name: from
            label: From Path
            type: string
            required: true
            description: 'Old path, e.g. old-page or blog/old-post (leading slash optional)'
          - name: to
            label: To Path or URL
            type: string
            required: true
            description: 'New path (e.g. new-page) or a full external URL (https://...)'
          - name: status
            label: Status Code
            type: select
            default: 301
            options:
              values:
                - label: '301 - Permanent Redirect'
                  value: 301
                - label: '302 - Temporary Redirect'
                  value: 302
            description: '301 for permanent moves, 302 for temporary redirects'

  # --------------------------------------------------------------------------
  # Navigation Menus
  # --------------------------------------------------------------------------
  - name: navigation
    label: Navigation Menus
    type: collection
    path: src/content/navigation
    format: json
    filename: '{{fields.slug}}.json'
    subfolders: false
    view:
      fields: [title]
      primary: title
    fields:
      - name: slug
        label: Menu ID
        type: string
        required: true
        description: Unique identifier for this menu (e.g. main, footer-1, footer-2)
        pattern:
          {
            message: "Must be a web-safe string like 'main' or 'footer-1'.",
            regex: '^[a-zA-Z0-9_-]*$',
          }

      - name: title
        label: Menu Title
        type: string
        required: true
        description: Display title for this menu

      - name: items
        label: Menu Items
        component: navigation_menu_item
        list: true
        required: true
